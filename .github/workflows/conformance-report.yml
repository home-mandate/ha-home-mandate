# SPDX-License-Identifier: AGPL-3.0-or-later
name: Conformance report

# Runs make conformance (mandate-conformance of the specification pinned in go.mod, over both
# bindings of the test interface) at the tag of a release and attaches both reports to that
# release, with build provenance:
#   conformance-report-process.json  classes evaluator, selection, audit, audit-anchored
#   conformance-report-http.json     class pdp
#   gh attestation verify conformance-report-process.json --repo home-mandate/ha-home-mandate
# home-mandate.org shows a conformance class as passed only with such a report.
# Called by release.yml after the release exists (a release created with the workflow token
# starts no other workflow), or by hand for an existing release (input: its tag).
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release, e.g. v0.1.0-rc.4
        required: true
        type: string

permissions:
  contents: read

jobs:
  run:
    name: Run mandate-conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - name: Check the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then
            echo "::error::$TAG is not a release tag"; exit 1
          fi
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run mandate-conformance
        run: |
          make conformance
          cp bin/conformance-process.json conformance-report-process.json
          cp bin/conformance-http.json conformance-report-http.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: conformance-report
          path: conformance-report*.json
          if-no-files-found: error
          retention-days: 1

  # Without the code under test: only this job may sign and write to the release.
  publish:
    name: Attest and attach
    needs: run
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the release asset
      id-token: write # the attestation's signing certificate
      attestations: write
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: conformance-report

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: conformance-report*.json

      # Never replaces an attached report; a re-run adds only what is missing.
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          attached=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
          for file in conformance-report*.json; do
            if grep -qxF "$file" <<< "$attached"; then echo "$file is already attached"; continue; fi
            gh release upload "$TAG" "$file" --repo "$GITHUB_REPOSITORY"
          done
