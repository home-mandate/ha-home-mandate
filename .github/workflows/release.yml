# SPDX-License-Identifier: AGPL-3.0-or-later
name: Release

# A tag vX.Y.Z or vX.Y.Z-rc.N on main publishes ghcr.io/home-mandate/ha-home-mandate:X.Y.Z[-rc.N]
# for linux/amd64 and linux/arm64: signed with cosign (keyless, Sigstore), with build
# provenance (SLSA, from BuildKit) and SBOMs (the image's, and one of the sources with the
# Go modules and the UI's npm packages, which a scan of the static binary cannot see), and a
# GitHub release.
#
# Guards: only admins may create tags and tags are immutable (repository rulesets). Before
# anything is built, the tag must point to a commit on main that came from a pull request
# whose checks all passed, match the version in app/config.yaml (Home Assistant's
# Supervisor uses it as the image tag), and neither the release nor the image tag may exist.
# The image is pushed by digest, signed and verified first; the version tag comes last, so no
# version tag ever points to an unsigned image.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/home-mandate/ha-home-mandate

jobs:
  verify:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the pull request the commit came from
      checks: read # its checks
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # main's history, to check where the tag points
          persist-credentials: false

      - name: Tag, branch and version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?)$ ]]; then
            echo "::error::tag $TAG is neither vX.Y.Z nor vX.Y.Z-rc.N"; exit 1
          fi
          version="${BASH_REMATCH[1]}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG points to a commit that is not on main"; exit 1
          fi
          app=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' app/config.yaml)
          if [ "$app" != "$version" ]; then
            echo "::error::app/config.yaml has version '$app', the tag $version"; exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          { echo "version=$version"; echo "prerelease=$prerelease"; } >> "$GITHUB_OUTPUT"

      # main takes squash-merged pull requests; their checks ran on the pull request's head.
      - name: The pull request's checks passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          heads=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.merged_at != null and .base.ref == "main") | .head.sha] | unique | .[]')
          if [ "$(printf '%s\n' "$heads" | grep -c .)" != 1 ]; then
            echo "::error::$GITHUB_SHA did not come from exactly one merged pull request into main"; exit 1
          fi
          runs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$heads/check-runs?per_page=100" \
            --jq '.check_runs[] | "\(.status)|\(.conclusion)|\(.name)"')
          printf '%s\n' "$runs"
          for required in "Go (" "E2E (" "Web E2E" "Container image" "govulncheck"; do
            grep -qF "|$required" <<< "$runs" || { echo "::error::check '$required' did not run"; exit 1; }
          done
          if grep -vE '^completed\|(success|skipped|neutral)\|' <<< "$runs"; then
            echo "::error::not every check of the pull request passed"; exit 1
          fi

      - name: Not released yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "::error::release $TAG exists already"; exit 1
          fi

  image:
    name: Image, signature, SBOM
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless signing with the workflow's identity
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tag not taken
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION exists already"; exit 1
          fi

      # Cross-compiled (Dockerfile): no stage runs under emulation. Pushed by digest only.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.title=Home-Mandate
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      # Includes build, test and tool dependencies: everything the release was made with.
      - name: SBOM of the sources
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: spdx-json
          output-file: sbom-source.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attach the SBOM to the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom-source.spdx.json "$IMAGE@$DIGEST"

      # What users are told to run must pass here first.
      - name: Verify what was published
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          issuer=https://token.actions.githubusercontent.com
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$IMAGE@$DIGEST" > /dev/null
          cosign verify-attestation --type spdxjson --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" "$IMAGE@$DIGEST" > /dev/null
          platforms=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
          for p in linux/amd64 linux/arm64; do
            [[ " $platforms " == *" $p "* ]] || { echo "::error::$p missing in $platforms"; exit 1; }
          done
          out=$(docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL "$IMAGE@$DIGEST" --version)
          [ "$out" = "home-mandate $VERSION" ] || { echo "::error::--version says '$out'"; exit 1; }
          # By the arm64 manifest's own digest: the index digest is already stored for amd64.
          arm64=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" \
            --format '{{range .Manifest.Manifests}}{{if eq .Platform.Architecture "arm64"}}{{.Digest}}{{end}}{{end}}')
          id=$(docker create --platform linux/arm64 "$IMAGE@$arm64")
          docker cp "$id:/home-mandate" ./home-mandate-arm64
          docker rm "$id" > /dev/null
          file ./home-mandate-arm64 | grep -q 'ARM aarch64' || { echo "::error::arm64 image holds no aarch64 binary"; exit 1; }

      - name: Tag the verified image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          tagged=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          [ "$tagged" = "$DIGEST" ] || { echo "::error::$IMAGE:$VERSION is $tagged, not $DIGEST"; exit 1; }

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-source
          path: sbom-source.spdx.json
          retention-days: 7

  release:
    name: GitHub release
    needs: [verify, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the GitHub release
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-source

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          cat > release-notes.md <<EOF
          Container image for linux/amd64 and linux/arm64:

              ${IMAGE}:${VERSION}
              ${IMAGE}@${DIGEST}

          Check the signature before you run it:

              cosign verify ${IMAGE}@${DIGEST} \\
                --certificate-identity ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF} \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com

          The image carries build provenance and an SBOM (docker buildx imagetools inspect), and a
          signed SBOM of the sources (cosign verify-attestation --type spdxjson), also attached here.
          EOF
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          # GitHub's list of merged pull requests follows the notes above.
          gh release create "$TAG" sbom-source.spdx.json --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "Home-Mandate $VERSION" --notes-file release-notes.md --generate-notes "${flags[@]}"
