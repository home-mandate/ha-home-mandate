# SPDX-License-Identifier: AGPL-3.0-or-later
name: Release

# A tag vX.Y.0-alpha.N, vX.Y.Z-rc.N or vX.Y.Z publishes ghcr.io/home-mandate/ha-home-mandate:X.Y.Z[-rc.N]
# for linux/amd64 and linux/arm64: signed with cosign (keyless, Sigstore), with build
# provenance (SLSA, from BuildKit) and SBOMs (the image's, and one of the sources with the
# Go modules and the UI's npm packages, which a scan of the static binary cannot see), and a
# GitHub release with the conformance reports (conformance-report.yml). The release is created
# as a draft, the reports are attached to the draft, and only a draft with the attested reports
# and the source SBOM is published. A published release is immutable (repository setting), so
# nothing can be added or replaced afterwards; a failed run leaves a draft and needs a new
# version.
#
# A release is a tag, not a commit (RELEASING.md of the organization): app/config.yaml carries
# X.Y.Z, and the image of a release candidate gets X.Y.Z-rc.N from the tag. A release candidate
# is tagged on release/X.Y, published, and then runs the release gate on its commit: every job
# of ci.yml and integration.yml, long fuzzing of every target, and the E2E scenarios and an
# update from the previous version against the published image. The version is tagged on the
# commit of a release candidate whose gate passed; this workflow then builds, signs and
# publishes without testing again.
#
# Guards: only admins may create tags and tags are immutable (repository rulesets). Before
# anything is built, home-mandate/.github/actions/release-verify checks where the tag stands,
# that the commit came from a merged pull request whose checks passed, that a version is a
# release candidate that passed, and that the release doesn't exist. Here: the tag matches the
# version in app/config.yaml (Home Assistant's Supervisor uses it as the image tag), a release
# candidate and a version have their entry in app/CHANGELOG.md, a version requires a version
# of the specification, and the image tag doesn't exist. The image is pushed by digest, signed
# and verified first; the version tag comes last, so no version tag ever points to an unsigned
# image.
#
# Run by hand with a tag name, the workflow only checks whether that tag could be released
# from the head of the chosen branch, and builds and publishes nothing. Do it before every tag:
#   gh workflow run release.yml --ref release/X.Y -f tag=vX.Y.Z-rc.1
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Dry run: the tag to check on the head of this branch. Publishes nothing."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/home-mandate/ha-home-mandate

jobs:
  verify:
    name: Check the tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read # the pull request the commit came from
      checks: read # its checks
      actions: read # the run of the release candidate a version stands on
    outputs:
      version: ${{ steps.verify.outputs.version }}
      base: ${{ steps.verify.outputs.base }}
      kind: ${{ steps.verify.outputs.kind }}
      prerelease: ${{ steps.verify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the branches' history and the tags, to check where the tag stands
          persist-credentials: false

      - id: verify
        uses: home-mandate/.github/actions/release-verify@f73af670bc516d6556a0203315b90c0c6554852f
        with:
          tag: ${{ inputs.tag || github.ref_name }}
          required-checks: |
            Scope (
            Go (
            govulncheck
            Web (
            Web E2E
            Container image
            E2E (
            Conformance (
            Fuzz (

      - name: The version, the changelog and the specification in the repository
        env:
          BASE: ${{ steps.verify.outputs.base }}
          KIND: ${{ steps.verify.outputs.kind }}
        run: |
          set -euo pipefail
          app=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' app/config.yaml)
          if [ "$app" != "$BASE" ]; then
            echo "::error::app/config.yaml has version '$app', the tag $BASE"; exit 1
          fi
          # The entry is written before the first release candidate: the version is its commit.
          if [ "$KIND" != alpha ] && ! grep -qxF "## $BASE" app/CHANGELOG.md; then
            echo "::error::app/CHANGELOG.md has no entry \"## $BASE\""; exit 1
          fi
          # What becomes a version names versions (RELEASING.md, "Releases that depend on each other").
          spec=$(awk '$1 == "github.com/home-mandate/spec" { print $2 } $1 == "require" && $2 == "github.com/home-mandate/spec" { print $3 }' go.mod)
          if ! [[ "$spec" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|rc)\.[0-9]+)?$ ]]; then
            echo "::error::go.mod requires github.com/home-mandate/spec $spec, which is not a release tag"; exit 1
          fi
          if [ "$KIND" = version ] && [[ "$spec" == *-* ]]; then
            echo "::error::a version must require a version of the specification, not $spec"; exit 1
          fi

  image:
    name: Image, signature, SBOM
    needs: verify
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push to ghcr.io
      id-token: write # keyless signing with the workflow's identity
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tag not taken
        run: |
          if docker buildx imagetools inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION exists already"; exit 1
          fi

      # Cross-compiled (Dockerfile): no stage runs under emulation. Pushed by digest only.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            VERSION=${{ env.VERSION }}
            COMMIT=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.title=Home-Mandate
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.3

      - name: Sign the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"

      # Includes build, test and tool dependencies: everything the release was made with.
      - name: SBOM of the sources
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom-source.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Attach the SBOM to the image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom-source.spdx.json "$IMAGE@$DIGEST"

      # What users are told to run must pass here first.
      - name: Verify what was published
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          identity="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          issuer=https://token.actions.githubusercontent.com
          cosign verify --certificate-identity "$identity" --certificate-oidc-issuer "$issuer" "$IMAGE@$DIGEST" > /dev/null
          cosign verify-attestation --type spdxjson --certificate-identity "$identity" \
            --certificate-oidc-issuer "$issuer" "$IMAGE@$DIGEST" > /dev/null
          platforms=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
          for p in linux/amd64 linux/arm64; do
            [[ " $platforms " == *" $p "* ]] || { echo "::error::$p missing in $platforms"; exit 1; }
          done
          out=$(docker run --rm --platform linux/amd64 --network none --read-only --cap-drop ALL "$IMAGE@$DIGEST" --version)
          [ "$out" = "home-mandate $VERSION" ] || { echo "::error::--version says '$out'"; exit 1; }
          # By the arm64 manifest's own digest: the index digest is already stored for amd64.
          arm64=$(docker buildx imagetools inspect "$IMAGE@$DIGEST" \
            --format '{{range .Manifest.Manifests}}{{if eq .Platform.Architecture "arm64"}}{{.Digest}}{{end}}{{end}}')
          id=$(docker create --platform linux/arm64 "$IMAGE@$arm64")
          docker cp "$id:/home-mandate" ./home-mandate-arm64
          docker rm "$id" > /dev/null
          file ./home-mandate-arm64 | grep -q 'ARM aarch64' || { echo "::error::arm64 image holds no aarch64 binary"; exit 1; }

      - name: Tag the verified image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker buildx imagetools create --tag "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
          tagged=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{.Manifest.Digest}}')
          [ "$tagged" = "$DIGEST" ] || { echo "::error::$IMAGE:$VERSION is $tagged, not $DIGEST"; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-source
          path: sbom-source.spdx.json
          retention-days: 7

  release:
    name: Draft of the GitHub release
    needs: [verify, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the GitHub release
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-source

      # A re-run of failed jobs finds the draft of the first attempt, keeps it and adds the
      # SBOM if it is missing.
      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
          DIGEST: ${{ needs.image.outputs.digest }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft -q .isDraft 2> /dev/null); then
            [ "$draft" = true ] || { echo "::error::release $TAG is published already"; exit 1; }
            echo "The draft of $TAG exists from an earlier attempt"
            assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')
            grep -qxF sbom-source.spdx.json <<< "$assets" || gh release upload "$TAG" sbom-source.spdx.json --repo "$GITHUB_REPOSITORY"
            exit 0
          fi
          cat > release-notes.md <<EOF
          Container image for linux/amd64 and linux/arm64:

              ${IMAGE}:${VERSION}
              ${IMAGE}@${DIGEST}

          Check the signature before you run it (cosign 3 or later):

              cosign verify ${IMAGE}@${DIGEST} \\
                --certificate-identity ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF} \\
                --certificate-oidc-issuer https://token.actions.githubusercontent.com

          The image carries build provenance and an SBOM (docker buildx imagetools inspect), and a
          signed SBOM of the sources (cosign verify-attestation --type spdxjson), also attached here.
          EOF
          flags=()
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          # GitHub's list of merged pull requests follows the notes above.
          gh release create "$TAG" sbom-source.spdx.json --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "Home-Mandate $VERSION" --notes-file release-notes.md --generate-notes "${flags[@]}"

  conformance-report:
    name: Conformance report
    needs: release
    permissions:
      contents: write # the release assets
      id-token: write # the attestation's signing certificate
      attestations: write
    uses: ./.github/workflows/conformance-report.yml
    with:
      tag: ${{ github.ref_name }}

  # The draft becomes the release only with the attested reports and the SBOM attached.
  publish:
    name: Publish the release
    needs: conformance-report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the release
      attestations: read # the reports' provenance
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: The reports and the SBOM are attached, the reports attested
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/assets"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$dir"
          for file in sbom-source.spdx.json conformance-report-process.json conformance-report-http.json; do
            [ -f "$dir/$file" ] || { echo "::error::$file is not attached to the draft of $TAG"; exit 1; }
          done
          for file in conformance-report-process.json conformance-report-http.json; do
            gh attestation verify "$dir/$file" --repo "$GITHUB_REPOSITORY"
          done

      - name: Publish the draft
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false

  # The release gate, for a release candidate only. A pull request runs the jobs of its scope
  # and short fuzzing; the commit that becomes a version runs everything, and the published
  # image is what the scenarios run against.
  gate-ci:
    name: Gate (CI)
    needs: [verify, publish]
    if: needs.verify.outputs.kind == 'rc'
    uses: ./.github/workflows/ci.yml
    with:
      full: true

  gate-integration:
    name: Gate (integration)
    needs: [verify, publish]
    if: needs.verify.outputs.kind == 'rc'
    uses: ./.github/workflows/integration.yml
    with:
      full: true

  fuzz-targets:
    name: Fuzz targets
    needs: [verify, publish]
    if: needs.verify.outputs.kind == 'rc'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "targets=$(make -s fuzz-targets)" >> "$GITHUB_OUTPUT"

  # Every target for 20 minutes on top of the corpus the runs of scheduled.yml have collected,
  # at most seven at a time: the organization runs 20 jobs at the same time at most.
  fuzz:
    name: Fuzz (long, ${{ matrix.target }})
    needs: fuzz-targets
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    env:
      # Check against the pinned version of the specification, never a workspace.
      GOWORK: "off"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Where Go keeps the corpus
        id: corpus
        run: echo "dir=$(go env GOCACHE)/fuzz" >> "$GITHUB_OUTPUT"
      # The key never matches: the newest corpus with the prefix is restored.
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.corpus.outputs.dir }}
          key: fuzz-corpus-v1-${{ github.run_id }}
          restore-keys: fuzz-corpus-v1-
      - env:
          TARGET: ${{ matrix.target }}
        run: make fuzz FUZZ_TARGETS="$TARGET" FUZZTIME=20m
      # A failing input is written to testdata/fuzz; keep it to reproduce the failure.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-failures-${{ strategy.job-index }}
          path: "**/testdata/fuzz/**"
          if-no-files-found: ignore

  # What users will run: the scenarios against the signed image of the release candidate, and
  # an update that starts it on the data of the previous version.
  e2e-image:
    name: E2E and update (the published image)
    needs: [verify, publish]
    if: needs.verify.outputs.kind == 'rc'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GOWORK: "off"
      E2E_RUNTIME: docker
      VERSION: ${{ needs.verify.outputs.version }}
      BASE: ${{ needs.verify.outputs.base }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tags, to find the previous version
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: make web-install
      - run: cd web && pnpm exec playwright install --with-deps chromium
      - name: The scenarios against the published image
        run: make e2e-ui E2E_IMAGE="$IMAGE:$VERSION"
      - name: An update from the previous version
        run: |
          set -euo pipefail
          previous=$({ git tag --list 'v[0-9]*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; echo "v$BASE"; } |
            sort -V -u | grep -B 1 -xF "v$BASE" | sed -n 1p)
          if [ "$previous" = "v$BASE" ]; then
            echo "::notice::no version before $BASE, nothing to update from"
            exit 0
          fi
          echo "update from ${previous#v} to $VERSION"
          make e2e-update FROM="$IMAGE:${previous#v}" TO="$IMAGE:$VERSION"

  # The job release-verify looks for before a version may stand on this commit: it succeeds
  # only if the release candidate was published and every part of the gate passed.
  gate:
    name: Release gate
    needs: [verify, publish, gate-ci, gate-integration, fuzz-targets, fuzz, e2e-image]
    if: always() && github.event_name == 'push' && needs.verify.outputs.kind == 'rc'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "verify, publish, gate-ci, gate-integration, fuzz-targets, fuzz, e2e-image: $RESULTS"
          [ "$RESULTS" = "success success success success success success success" ]
