# SPDX-License-Identifier: AGPL-3.0-or-later
name: Integration

# Integration stage: mandate-conformance, short fuzzing, container image, Playwright and
# E2E against Home Assistant, for every push into a pull request against main and manual
# runs. Never on a plain branch push and never after the merge (see ci.yml). main is
# protected: squash-merged pull requests only, with the checks of both workflows required.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

env:
  # Check against the pinned mandate-spec version, never a workspace.
  GOWORK: "off"

jobs:
  conformance:
    name: Conformance (mandate-conformance, process and HTTP binding)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make conformance

  fuzz:
    name: Fuzz (short)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make fuzz FUZZTIME=60s

  e2e-web:
    name: Web E2E (Playwright, de + en)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: make web-install
      - run: cd web && pnpm exec playwright install --with-deps chromium
      - run: make web-e2e

  image:
    name: Container image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --build-arg VERSION=${{ github.sha }} -t home-mandate:ci .
      - run: docker run --rm home-mandate:ci --version

  e2e:
    name: E2E (Home Assistant + release image, UI behind Ingress)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: web/.nvmrc
          package-manager-cache: false
      - run: corepack enable pnpm
      - run: make web-install
      - run: cd web && pnpm exec playwright install --with-deps chromium
      - run: make e2e-ui
        env:
          E2E_RUNTIME: docker
