# Categories of the automatically generated release notes (gh release create --generate-notes),
# by the labels of the merged pull requests.
changelog:
  exclude:
    labels:
      - duplicate
      - invalid
      - wontfix
  categories:
    - title: Fixes
      labels: [bug]
    - title: New
      labels: [enhancement]
    - title: Accessibility
      labels: [accessibility]
    - title: Documentation
      labels: [documentation]
    - title: Other changes
      labels: ["*"]
