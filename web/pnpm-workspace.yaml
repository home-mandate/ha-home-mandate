# Supply-chain hardening (docs/ARCHITECTURE.md section 12)
# Only versions published at least 7 days ago are installed.
minimumReleaseAge: 10080
# Dependency install scripts never run; fail instead of silently skipping one.
strictDepBuilds: true
# Refuse a version whose publish provenance is weaker than an earlier one.
trustPolicy: no-downgrade
# No git or tarball URLs anywhere in the dependency tree.
blockExoticSubdeps: true
saveExact: true
# Security fixes for transitive dependencies (remove once the parents require them):
# source-map-js < 1.2.2: GHSA-68fv-2mgg-jv7q (build and test tooling only).
overrides:
  source-map-js: 1.2.2
# Advisories without a fixed version (re-check when the parent updates):
# deepmerge <= 4.3.1: GHSA-gcqx-w48m-w2h4, low. Only @sveltejs/vite-plugin-svelte uses it,
# at build time, to merge our own Svelte config; no untrusted input reaches it.
auditConfig:
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4
