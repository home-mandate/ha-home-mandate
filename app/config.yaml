# SPDX-License-Identifier: AGPL-3.0-or-later
# Home Assistant app (formerly "add-on"). Reference:
# https://developers.home-assistant.io/docs/apps/configuration/
name: Home-Mandate
version: "0.1.0"
slug: home_mandate
description: Mandates for AI agents in Home Assistant – allow, ask, deny, log.
url: https://github.com/home-mandate/ha-home-mandate
# One multi-arch image (release.yml); the Supervisor pulls <image>:<version>.
image: ghcr.io/home-mandate/ha-home-mandate
arch:
  - amd64
  - aarch64
stage: experimental
homeassistant: "2026.9.0"
init: false
startup: application
boot: auto

# UI via Ingress; Home Assistant handles sign-in. Home-Mandate serves only the Supervisor
# (172.30.32.2) and only Home Assistant administrators (docs/ARCHITECTURE.md section 8).
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-account
panel_title: Home-Mandate

# Home Assistant's API through the Supervisor (SUPERVISOR_TOKEN)
homeassistant_api: true

# MCP endpoint for agents: TLS 1.3 with a certificate from /ssl, otherwise localhost only
ports:
  8765/tcp: 8765
map:
  - ssl:ro

# The audit log is an SQLite database; a copy taken while it is written could be
# inconsistent, so the Supervisor stops the app for the backup.
backup: cold

options:
  tls_certfile: fullchain.pem
  tls_keyfile: privkey.pem
  approval_timeout_seconds: 120
  log_level: info
schema:
  tls_certfile: str
  tls_keyfile: str
  approval_timeout_seconds: int(30,600)
  log_level: list(debug|info|warning|error)
  # Both optional: without public_url, no agent can be admitted (OAuth is off).
  public_url: url?
  ha_browser_url: url?
