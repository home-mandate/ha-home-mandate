# Home Assistant app (formerly "add-on") – draft
# Check against the current developer documentation before the first build:
# https://developers.home-assistant.io/docs/apps/configuration/
name: Home-Mandate
version: "0.1.0"
slug: home_mandate
description: Mandates for AI agents – allow, ask, deny, log.
url: https://home-mandate.com
image: ghcr.io/home-mandate/ha-home-mandate
arch:
  - amd64
  - aarch64
init: false
startup: application
boot: auto

# UI via Ingress; Home Assistant handles sign-in.
# Security: Ingress requests come exclusively from 172.30.32.2 –
# the UI must reject all other sources.
ingress: true
ingress_port: 8099
panel_icon: mdi:shield-account
panel_title: Home-Mandate

# Access to the HA API via the Supervisor (SUPERVISOR_TOKEN)
homeassistant_api: true

# MCP endpoint for agents (TLS)
ports:
  8765/tcp: 8765
ports_description:
  8765/tcp: MCP endpoint for AI agents (HTTPS)

# Read certificates from /ssl (decision 1)
map:
  - ssl:ro

options:
  tls_certfile: fullchain.pem
  tls_keyfile: privkey.pem
  approval_timeout_seconds: 120
  log_level: info
schema:
  tls_certfile: str
  tls_keyfile: str
  approval_timeout_seconds: int(30,600)
  log_level: list(debug|info|warning|error)
