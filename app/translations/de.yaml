configuration:
  tls_certfile:
    name: TLS-Zertifikat
    description: >-
      Datei in /ssl mit der Zertifikatskette für den MCP-Endpunkt, z. B. fullchain.pem. Sie
      muss den Host der öffentlichen URL abdecken. Ohne sie antwortet der Endpunkt nur auf localhost.
      Beide TLS-Optionen leer schaltet TLS ab: Der Endpunkt antwortet dann nur auf localhost.
  tls_keyfile:
    name: Privater TLS-Schlüssel
    description: >-
      Datei in /ssl mit dem privaten Schlüssel des Zertifikats, z. B. privkey.pem. Beide
      TLS-Optionen setzen oder beide leer lassen.
  approval_timeout_seconds:
    name: Wartezeit auf Freigaben
    description: >-
      Wie lange eine Aktion auf eine Freigabe wartet, in Sekunden (30–600). Ein Mandat darf
      sie nur verkürzen.
  approval_wait_seconds:
    name: Wartezeit des Agenten
    description: >-
      Wie lange der Aufruf eines Agenten auf die Antwort wartet, in Sekunden (5–55, Standard
      45). Ohne Antwort bis dahin erfährt der Agent, dass die Aktion noch nicht ausgeführt
      ist, und fragt später nach; die Anfrage bleibt bis zu ihrer Wartezeit offen.
  log_level:
    name: Protokollstufe
    description: debug, info, warning oder error.
  public_url:
    name: Öffentliche URL
    description: >-
      Die Adresse, unter der Agenten und Browser Home-Mandate erreichen. Direkt erreicht
      mit Port, z. B. https://hm.example.org:8765; hinter einem Reverse Proxy die Adresse
      des Proxys ohne Port, z. B. https://hm.example.org. Ohne sie kann kein Agent
      zugelassen werden.
  ha_browser_url:
    name: Home-Assistant-URL für deinen Browser
    description: >-
      Home Assistant, wie dein Browser es erreicht, z. B. https://ha.example.org:8123. Nötig
      zusammen mit der öffentlichen URL: Die Anmeldung zum Zulassen eines Agenten läuft über
      Home Assistant.
  dpop:
    name: DPoP-gebundene Tokens
    description: >-
      off (Standard), optional oder required. Mit DPoP funktionieren die Tokens eines Agenten
      nur zusammen mit einem Schlüssel, der bei seinem Client bleibt; ein gestohlenes Token
      nützt anderswo nichts. optional bindet die Tokens der Agenten, die es können; required
      lässt nur solche Agenten zu. Ein einmal gebundener Agent bleibt gebunden, auch wenn
      DPoP wieder ausgeschaltet wird.
  ct_watch:
    name: Zertifikatsüberwachung
    description: >-
      on (Standard) oder off. Home-Mandate durchsucht die öffentlichen Certificate-Transparency-
      Logs nach Zertifikaten für den Namen der öffentlichen URL, die es nicht selbst bezogen
      hat, und meldet sie den Freigebenden. Wer ein solches Zertifikat hat, könnte Verbindungen
      der Agenten abfangen. Die Abfragen gehen an Cert Spotter (SSLMate) und crt.sh und nennen
      nur den öffentlichen Namen.
  ct_sslmate_key:
    name: Cert-Spotter-API-Schlüssel
    description: >-
      Optional. Ohne Schlüssel erlaubt Cert Spotter eine begrenzte Zahl Abfragen pro IP-Adresse;
      Haushalte hinter einer gemeinsamen IPv4-Adresse teilen sie sich.
network:
  8765/tcp: MCP-Endpunkt für KI-Agenten (HTTPS)
